name: App Node

# Instalar, lint, tipos, tests y build de una app con bun, npm o pnpm.

on:
  workflow_call:
    inputs:
      gestor:
        description: bun, npm o pnpm
        type: string
        required: true
      node:
        description: Versión de Node (con bun no se usa)
        type: string
        default: "22"
      pnpm:
        description: Versión de pnpm; vacío = la de packageManager
        type: string
        default: ""
      directorio:
        description: Dónde está el package.json
        type: string
        default: "."
      lint:
        type: boolean
        default: false
      typecheck:
        type: boolean
        default: false
      test:
        type: boolean
        default: false
      build:
        type: boolean
        default: true
      env:
        description: Variables para todo el job, CLAVE=valor una por línea
        type: string
        default: ""
      extra:
        description: Comandos sueltos al final, desde la raíz del repo
        type: string
        default: ""
      secretos:
        description: gitleaks sobre los commits nuevos (false si el repo llama a esto varias veces)
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  secretos:
    if: inputs.secretos
    uses: IsDerky/ci/.github/workflows/secretos.yml@v1

  ci:
    runs-on: ubuntu-latest
    # Un push nuevo cancela el run viejo de la misma rama (salvo en main/master, abajo).
    concurrency:
      # En main/master cada run va en su propio grupo: ni se cancela ni lo cancela uno nuevo
      # en espera («higher priority waiting request»).
      group: ci-${{ github.repository }}-${{ github.ref }}-${{ inputs.directorio }}${{ (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') && format('-{0}', github.run_id) || '' }}
      cancel-in-progress: true
    defaults:
      run:
        working-directory: ${{ inputs.directorio }}
    env:
      GESTOR: ${{ inputs.gestor }}
    steps:
      - uses: actions/checkout@v5

      - name: Variables
        if: inputs.env != ''
        env:
          VARS: ${{ inputs.env }}
        run: printf '%s\n' "$VARS" >> "$GITHUB_ENV"

      - if: inputs.gestor == 'bun'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # setup-bun no guarda la caché de paquetes; npm y pnpm la tienen por setup-node.
      - if: inputs.gestor == 'bun'
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles(format('{0}/bun.lock*', inputs.directorio)) }}
          restore-keys: bun-${{ runner.os }}-

      - if: inputs.gestor == 'pnpm'
        uses: pnpm/action-setup@v4
        with:
          version: ${{ inputs.pnpm }}
          package_json_file: ${{ inputs.directorio }}/package.json

      - if: inputs.gestor != 'bun'
        uses: actions/setup-node@v5
        with:
          node-version: ${{ inputs.node }}
          cache: ${{ inputs.gestor }}
          cache-dependency-path: ${{ inputs.directorio }}/${{ inputs.gestor == 'pnpm' && 'pnpm-lock.yaml' || 'package-lock.json' }}

      - name: Instalar
        run: |
          case "$GESTOR" in
            bun)  bun install --frozen-lockfile; echo "RUN=bun run" >> "$GITHUB_ENV" ;;
            npm)  npm ci;                        echo "RUN=npm run" >> "$GITHUB_ENV" ;;
            pnpm) pnpm install --frozen-lockfile; echo "RUN=pnpm run" >> "$GITHUB_ENV" ;;
            *)    echo "::error::gestor desconocido: $GESTOR"; exit 1 ;;
          esac

      - if: inputs.lint
        run: $RUN lint

      - if: inputs.typecheck
        run: $RUN typecheck

      # Con bun, el test runner propio (sin script "test" en el package.json)
      - if: inputs.test
        run: |
          if [ "$GESTOR" = bun ]; then bun test; else $RUN test; fi

      # Caché de compilación de Next: el build solo rehace lo que ha cambiado.
      - if: inputs.build && hashFiles(format('{0}/next.config.*', inputs.directorio)) != ''
        uses: actions/cache@v4
        with:
          path: ${{ inputs.directorio }}/.next/cache
          key: next-${{ runner.os }}-${{ hashFiles(format('{0}/*.lock*', inputs.directorio), format('{0}/*-lock.*', inputs.directorio)) }}-${{ github.sha }}
          restore-keys: next-${{ runner.os }}-${{ hashFiles(format('{0}/*.lock*', inputs.directorio), format('{0}/*-lock.*', inputs.directorio)) }}-

      - if: inputs.build
        run: $RUN build

      - name: Extra
        if: inputs.extra != ''
        working-directory: .
        env:
          EXTRA: ${{ inputs.extra }}
        run: bash -euo pipefail -c "$EXTRA"
