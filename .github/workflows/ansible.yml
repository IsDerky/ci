name: Ansible

# ansible-lint con las colecciones del requirements.yml.

on:
  workflow_call:
    inputs:
      directorio:
        type: string
        default: ansible
      rutas:
        description: Qué se pasa a ansible-lint
        type: string
        default: playbooks roles
      secretos:
        description: gitleaks sobre los commits nuevos
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  secretos:
    if: inputs.secretos
    uses: IsDerky/ci/.github/workflows/secretos.yml@v1

  lint:
    runs-on: ubuntu-latest
    concurrency:
      # En main/master cada run va en su propio grupo: ni se cancela ni lo cancela uno nuevo
      # en espera («higher priority waiting request»).
      group: ansible-${{ github.repository }}-${{ github.ref }}${{ (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') && format('-{0}', github.run_id) || '' }}
      cancel-in-progress: true
    defaults:
      run:
        working-directory: ${{ inputs.directorio }}
    steps:
      - uses: actions/checkout@v5
      # Lo que baja pip para ansible-lint (cambia poco; la clave es por semana).
      - id: semana
        run: echo "n=$(date +%G-%V)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-ansible-lint-${{ steps.semana.outputs.n }}
          restore-keys: pip-ansible-lint-
      - run: pipx install ansible-lint && pipx inject ansible-lint ansible-core
      - env:
          RUTAS: ${{ inputs.rutas }}
        run: |
          # El ansible-galaxy del runner ya trae las colecciones, pero ansible-lint
          # (pipx) no las ve: se instalan donde las busca
          if [ -f requirements.yml ]; then
            ansible-galaxy collection install -r requirements.yml -p ~/.ansible/collections --force
          fi
          # shellcheck disable=SC2086
          ansible-lint $RUTAS
