name: Secretos

# gitleaks sobre los commits nuevos: los del PR, o los del push. El historial
# viejo no: lo que ya se publicó se arregla rotando la clave, no en el CI.
# Falsos positivos: .gitleaks.toml o .gitleaksignore en la raíz del repo.

on:
  workflow_call:

permissions:
  contents: read

env:
  # renovate: datasource=github-releases depName=gitleaks/gitleaks
  GITLEAKS_VERSION: 8.30.1

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: gitleaks
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          RAMA_PRINCIPAL: ${{ github.event.repository.default_branch }}
        run: |
          d=$(mktemp -d)
          url=https://github.com/gitleaks/gitleaks/releases/download/v$GITLEAKS_VERSION
          tar=gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz
          curl -fsSL --retry 3 -o "$d/$tar" "$url/$tar"
          curl -fsSL --retry 3 -o "$d/sumas" "$url/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          (cd "$d" && grep " $tar\$" sumas | sha256sum -c -)
          tar -xzf "$d/$tar" -C "$d" gitleaks

          # rama nueva o push forzado: lo que no está en la principal
          if [ -n "$BASE" ] && [ -z "${BASE//0/}" ]; then BASE=""; fi
          if [ -n "$BASE" ] && git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            rango="$BASE..HEAD"
          else
            rango="origin/$RAMA_PRINCIPAL..HEAD"
          fi
          if [ "$(git rev-list --count "$rango")" = 0 ]; then rango="HEAD~1..HEAD"; fi
          echo "Commits revisados: $(git rev-list --count "$rango") ($rango)"
          "$d/gitleaks" git --no-banner --redact --verbose --log-opts="$rango" .
