name: Imagen

# docker build, arranque y una petición HTTP. Si se pide, sube a GHCR
# (el que llama tiene que dar packages: write).

on:
  workflow_call:
    inputs:
      contexto:
        type: string
        default: "."
      puerto:
        description: Puerto que expone el contenedor
        type: number
        default: 3000
      ruta:
        description: Ruta que tiene que dar 2xx
        type: string
        default: "/"
      env:
        description: Variables para el contenedor, CLAVE=valor una por línea
        type: string
        default: ""
      publicar:
        type: boolean
        default: false

# Sin permissions: hereda los del que llama (un reusable no puede pedir más)

jobs:
  imagen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3

      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: ${{ inputs.contexto }}
          push: false
          load: true
          tags: app:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Arranca y responde
        env:
          PUERTO: ${{ inputs.puerto }}
          RUTA: ${{ inputs.ruta }}
          VARS: ${{ inputs.env }}
        run: |
          printf '%s\n' "$VARS" | grep -v '^$' > app.env || true
          docker run -d --name app --env-file app.env -p "$PUERTO:$PUERTO" app:ci
          for _ in $(seq 1 30); do
            curl -fsS -o /dev/null "http://127.0.0.1:$PUERTO$RUTA" && exit 0
            sleep 1
          done
          docker logs app
          exit 1

      - name: Nombre en GHCR
        if: inputs.publicar
        run: echo "IMAGEN=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - if: inputs.publicar
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Sale de la caché del build de arriba
      - if: inputs.publicar
        uses: docker/build-push-action@v6
        with:
          context: ${{ inputs.contexto }}
          push: true
          tags: ${{ env.IMAGEN }}:${{ github.sha }},${{ env.IMAGEN }}:latest
          cache-from: type=gha
